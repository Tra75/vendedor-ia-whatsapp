<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebeca - Assistente de Vendas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mensagem {
      display: flex;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mensagem.cliente {
      justify-content: flex-end;
    }

    .mensagem.rebeca {
      justify-content: flex-start;
    }

    .conteudo {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .mensagem.cliente .conteudo {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .mensagem.rebeca .conteudo {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .status {
      font-size: 12px;
      color: #999;
      padding: 0 16px;
      text-align: center;
      margin: 10px 0;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #667eea;
    }

    input::placeholder {
      color: #999;
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info {
      font-size: 12px;
      color: #999;
      padding: 0 16px 10px;
      text-align: center;
    }

    .erro {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 8px;
      margin: 5px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🤖 Rebeca</h1>
      <p>Assistente Virtual de Vendas do Lucas</p>
    </header>

    <div class="chat-area" id="chat">
      <div class="status">Iniciando conversa...</div>
    </div>

    <div class="input-area">
      <input
        id="mensagem"
        type="text"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
      >
      <button id="enviar" onclick="enviarMensagem()">Enviar</button>
    </div>

    <div class="info" id="info"></div>
  </div>

  <script>
    // Estado da conversa
    const estado = {
      identificador: "teste_" + Date.now(),
      nome: "",
      carregando: false
    };

    const chatArea = document.getElementById("chat");
    const campoMensagem = document.getElementById("mensagem");
    const botaoEnviar = document.getElementById("enviar");
    const infoArea = document.getElementById("info");

    // Enviar mensagem ao pressionar Enter
    campoMensagem.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !estado.carregando) {
        enviarMensagem();
      }
    });

    // Adicionar saudação inicial
    function adicionarSaudacaoInicial() {
      adicionarMensagem(
        "rebeca",
        "Oi! 👋 Sou a Rebeca, assistente virtual de vendas do Lucas. Como posso te ajudar?"
      );
    }

    // Adicionar mensagem ao chat
    function adicionarMensagem(tipo, texto) {
      const div = document.createElement("div");
      div.className = `mensagem ${tipo}`;

      const conteudo = document.createElement("div");
      conteudo.className = "conteudo";
      conteudo.textContent = texto;

      div.appendChild(conteudo);
      chatArea.appendChild(div);

      // Scroll para baixo
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Enviar mensagem
    async function enviarMensagem() {
      const mensagem = campoMensagem.value.trim();

      if (!mensagem) {
        return;
      }

      if (estado.carregando) {
        return;
      }

      // Adicionar mensagem do usuário
      adicionarMensagem("cliente", mensagem);
      campoMensagem.value = "";

      // Mostrar carregamento
      estado.carregando = true;
      botaoEnviar.disabled = true;
      infoArea.textContent = "Rebeca está respondendo...";

      try {
        const inicio = Date.now();

        const resposta = await fetch("/mensagem", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensagem: mensagem,
            identificador: estado.identificador,
            nome: estado.nome
          })
        });

        if (!resposta.ok) {
          const erro = await resposta.json();
          throw new Error(erro.erro || "Erro ao enviar mensagem");
        }

        const dados = await resposta.json();

        // Adicionar resposta da Rebeca
        adicionarMensagem("rebeca", dados.resposta);

        const duracao = Date.now() - inicio;
        infoArea.textContent = `Respondido em ${duracao}ms • ID: ${estado.identificador}`;

      } catch (erro) {
        console.error("Erro:", erro);
        adicionarMensagem(
          "rebeca",
          "Desculpe, ocorreu um erro ao processar sua mensagem. Pode tentar novamente? 😊"
        );
        infoArea.innerHTML = `<div class="erro">Erro: ${erro.message}</div>`;
      } finally {
        estado.carregando = false;
        botaoEnviar.disabled = false;
        campoMensagem.focus();
      }
    }

    // Inicializar
    adicionarSaudacaoInicial();
    campoMensagem.focus();
  </script>

</body>
</html>
